services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: daneshjohandbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # No POSTGRES_HOST_AUTH_METHOD: network connections need the password
      # (scram-sha-256). It only applies when the data directory is created; on
      # the existing volume pg_hba.conf was changed by hand (README, Backup and restore).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The bot (profile "bot": `docker compose --profile bot up -d --build`), so a
  # plain `docker compose up -d` still starts only the services `npm run dev`
  # needs; two bots polling Bale at once would compete for the same updates.
  # Ollama stays on Windows (Docker Desktop can't give containers the AMD GPU)
  # and is reached through host.docker.internal. .env stays valid for
  # `npm run dev`; only the service addresses are overridden here.
  bot:
    build: .
    container_name: daneshjohandbot-bot
    profiles: ["bot"]
    restart: unless-stopped
    # Graceful shutdown: 15 s for running answers, 3 s to wrap up (config.shutdown).
    stop_grace_period: 25s
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LLM_URL: http://host.docker.internal:11434/api/chat
      OLLAMA_EMBED_URL: http://host.docker.internal:11434/api/embed
      RERANKER_URL: http://reranker:8080/v1/rerank
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      reranker:
        condition: service_started
    # /ready: "healthy" means it can answer (database, Ollama, reranker), not just that it runs.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + process.env.PORT + '/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Daily database dump after 03:00 (Tehran time) into ./backups, kept 14 days.
  # Same image as postgres, so pg_dump matches the server version.
  # It checks every 10 minutes whether today's dump exists, instead of sleeping
  # until 03:00: the Docker VM is suspended while Windows sleeps, and one long
  # sleep then stretched over days (only 2 dumps from 11-03 to 11-13).
  # Restore: README, "Backup and restore".
  backup:
    image: pgvector/pgvector:pg18
    container_name: daneshjohandbot-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Tehran
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          today="/backups/daneshjo-$$(date +%F).dump"
          if [ ! -f "$$today" ] && [ "$$(date +%H)" -ge 3 ]; then
            # Write to a temporary name first, so a failed dump never looks like a backup.
            if pg_dump -Fc -f /backups/.partial.dump; then
              mv /backups/.partial.dump "$$today"
              echo "backup written: $$(basename "$$today")"
            else
              echo "backup FAILED" >&2
            fi
            find /backups -name 'daneshjo-*.dump' -mtime +14 -delete
          fi
          sleep 600
        done

  # Cross-encoder reranker (bge-reranker-v2-m3) on llama.cpp server, CPU only so
  # the GPU stays free for Ollama. Model file: models/bge-reranker-v2-m3-Q8_0.gguf
  # (see README). Image pinned to llama.cpp build 12004.
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:b32890309c1a33a534a01b0b461e953dc2c5a6bac20213abcf48e22847a19c85
    container_name: daneshjohandbot-reranker
    restart: unless-stopped
    command:
      - -m
      - /models/bge-reranker-v2-m3-Q8_0.gguf
      - --rerank
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Each (question, chunk) pair must fit in one batch.
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "2048"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models:/models:ro

volumes:
  postgres_data:
