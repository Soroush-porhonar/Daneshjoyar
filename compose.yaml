services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: daneshjohandbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly database dump at 03:00 (Tehran time) into ./backups, kept 14 days.
  # Same image as postgres, so pg_dump matches the server version.
  # Restore: README, "Backup and restore".
  backup:
    image: pgvector/pgvector:pg18
    container_name: daneshjohandbot-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Tehran
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s)
          next=$$(date -d '03:00' +%s)
          [ "$$next" -le "$$now" ] && next=$$(date -d 'tomorrow 03:00' +%s)
          sleep $$((next - now))
          # Write to a temporary name first, so a failed dump never looks like a backup.
          if pg_dump -Fc -f /backups/.partial.dump; then
            mv /backups/.partial.dump "/backups/daneshjo-$$(date +%F).dump"
            echo "backup written: daneshjo-$$(date +%F).dump"
          else
            echo "backup FAILED" >&2
          fi
          find /backups -name 'daneshjo-*.dump' -mtime +14 -delete
        done

  # Cross-encoder reranker (bge-reranker-v2-m3) on llama.cpp server, CPU only so
  # the GPU stays free for Ollama. Model file: models/bge-reranker-v2-m3-Q8_0.gguf
  # (see README). Image pinned to llama.cpp build 12004.
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:b32890309c1a33a534a01b0b461e953dc2c5a6bac20213abcf48e22847a19c85
    container_name: daneshjohandbot-reranker
    restart: unless-stopped
    command:
      - -m
      - /models/bge-reranker-v2-m3-Q8_0.gguf
      - --rerank
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Each (question, chunk) pair must fit in one batch.
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "2048"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models:/models:ro

volumes:
  postgres_data:
